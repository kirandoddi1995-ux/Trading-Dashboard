name: Protected production rollback package

on:
  workflow_dispatch:
    inputs:
      request_path:
        description: Signed ROLLBACK request committed to the repository
        required: true
        type: string
      rollback_ref:
        description: Immutable commit SHA for the last known-good release
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-model-governance
  cancel-in-progress: false

jobs:
  authorize-and-package:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout authorization request
        uses: actions/checkout@v4
        with:
          path: authorization
      - name: Checkout immutable rollback candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.rollback_ref }}
          path: candidate
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: candidate/requirements.txt
      - name: Authenticate to Google Cloud for managed promotion keys
        if: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && vars.GCP_SECRET_READER_SERVICE_ACCOUNT != '' }}
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SECRET_READER_SERVICE_ACCOUNT }}
      - run: python -m pip install -r candidate/requirements.txt pytest
      - name: Verify signed rollback request and independent approvals
        working-directory: authorization
        env:
          MODEL_ARTIFACT_SIGNING_KEY_ID: ${{ vars.MODEL_ARTIFACT_SIGNING_KEY_ID }}
          GCP_SECRET_MANAGER_PROJECT: ${{ vars.GCP_SECRET_MANAGER_PROJECT }}
          MODEL_ARTIFACT_SIGNING_SECRET_REF: ${{ vars.MODEL_ARTIFACT_SIGNING_SECRET_REF }}
          MODEL_APPROVER_SECRET_REFS_JSON: ${{ vars.MODEL_APPROVER_SECRET_REFS_JSON }}
          REQUIRE_MANAGED_PROMOTION_KEYS: 'true'
        run: python verify_promotion_request.py "${{ inputs.request_path }}" --require-action ROLLBACK
      - name: Verify rollback candidate
        working-directory: candidate
        run: python -m pytest -q
      - name: Build immutable rollback package
        working-directory: candidate
        run: python package_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: rollback-${{ inputs.rollback_ref }}
          path: candidate/release-*.zip
          if-no-files-found: error
          retention-days: 30
