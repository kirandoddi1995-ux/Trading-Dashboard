name: Real evidence model-pipeline refusal smoke

on:
  workflow_dispatch:
    inputs:
      features:
        description: Comma-separated registered evidence-spine feature names
        required: true
        default: scanner_composite_score
        type: string
      horizon_sessions:
        description: Target horizon in completed NSE sessions
        required: true
        default: 5
        type: number

permissions:
  contents: read

concurrency:
  group: real-evidence-model-smoke
  cancel-in-progress: false

jobs:
  verify-safe-refusal:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Run pipeline against the immutable production evidence spine
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          EVIDENCE_LEDGER_SIGNING_KEY: ${{ secrets.EVIDENCE_LEDGER_SIGNING_KEY }}
          STEP3_FEATURES: ${{ inputs.features }}
          STEP3_HORIZON: ${{ inputs.horizon_sessions }}
        run: >-
          python model_training_pipeline.py --smoke
          --features "$STEP3_FEATURES"
          --horizon "$STEP3_HORIZON"
          --expect-no-artifact
