name: Derivative reference ingestion
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Offline preview, read-only check, or supervised NIFTY pilot
        type: choice
        options: [preview, check, pilot]
        default: preview
      confirm_pilot:
        description: Authorise this one reference-writing pilot (not trading)
        type: boolean
        default: false
  schedule:
    - cron: '15 3 * * 1-5'
permissions:
  contents: read
concurrency:
  group: derivative-references
  cancel-in-progress: false
jobs:
  ingest:
    # Scheduling is read-only until verified retention is built and commissioned.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && vars.DERIVATIVE_REFERENCE_ENABLED == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - name: Reference commissioning (no migrations or orders)
        env:
          RUN_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'check' }}
          DERIVATIVE_RUN_EVENT: ${{ github.event_name }}
          DERIVATIVE_PILOT_CONFIRMATION: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'pilot' && inputs.confirm_pilot == true && 'true' || 'false' }}
          DERIVATIVE_REFERENCE_DATABASE_URL: ${{ secrets.DERIVATIVE_REFERENCE_DATABASE_URL }}
          DERIVATIVE_UNDERLYINGS_JSON: ${{ vars.DERIVATIVE_UNDERLYINGS_JSON }}
        run: |
          SESSION_DATE=$(TZ=Asia/Kolkata date +%F)
          python derivative_repository.py --mode "$RUN_MODE" --date "$SESSION_DATE"
