name: Derivative reference ingestion
on:
  workflow_dispatch:
  schedule:
    - cron: '15 3 * * 1-5'
permissions:
  contents: read
concurrency:
  group: derivative-references
  cancel-in-progress: false
jobs:
  ingest:
    if: vars.DERIVATIVE_REFERENCE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - name: Ingest dated references (no migrations or orders)
        env:
          DERIVATIVE_REFERENCE_DATABASE_URL: ${{ secrets.DERIVATIVE_REFERENCE_DATABASE_URL }}
          DERIVATIVE_UNDERLYINGS_JSON: ${{ vars.DERIVATIVE_UNDERLYINGS_JSON }}
        run: |
          SESSION_DATE=$(TZ=Asia/Kolkata date +%F)
          python derivative_repository.py --date "$SESSION_DATE"
