name: Verified Drive archive (nightly restore-proven retention when enabled)
run-name: >-
  ${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'nightly')
  && 'Nightly archive (on-time dispatch)' || github.workflow }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: preview / export (no deletion, up to max batches per table) / restore-check (read-only, every batch) / delete (restore proof first) / prune-preserved (only an independently verified generation) / nightly (the scheduled retention run, sent on time by Supabase Cron; other inputs ignored)
        type: choice
        default: preview
        options: [preview, export, restore-check, delete, prune-preserved, nightly]
      table:
        description: Approved source table
        type: choice
        default: mf_nav
        options: [mf_nav, market_quotes, universe_membership_versions, scanner_observations, equity_research.outcomes, universe_membership, evidence_ledger_events, growing]
      nav_cutoff:
        description: Optional one-time NAV cutoff YYYY-MM-DD (blank = 14 days)
        type: string
        default: ''
      batch_size:
        description: Optional batch size 1–2000 (blank = safe per-table default)
        type: string
        default: ''
      max_batches:
        description: Batch bound 1–200 per table (prune-preserved - batches per run)
        type: string
        default: '1'
      preserved_before:
        description: prune-preserved only - generation timestamp with offset, exactly as given
        type: string
        default: ''
      preserved_batches:
        description: prune-preserved only - batch count verified on the independent copy
        type: string
        default: ''
      preserved_sha256:
        description: prune-preserved only - fingerprint verified on the independent copy
        type: string
        default: ''
      proven_after:
        description: restore-check / prune-preserved - deep-check only batches recorded after this time (previous cycle's preserved_before); blank = every batch
        type: string
        default: ''
      max_minutes:
        description: prune-preserved only - start no new batch after this many minutes (blank = no bound)
        type: string
        default: '150'
  # Primary nightly trigger: Supabase Cron dispatches mode=nightly at 20:15 UTC
  # (supabase/archive-nightly-cron.sql). GitHub delivers this schedule hours late;
  # it stays only as a fallback and skips itself when the on-time run succeeded.
  schedule:
    - cron: '15 20 * * *'

permissions:
  contents: read

concurrency:
  group: verified-drive-archive
  cancel-in-progress: false

jobs:
  scheduled-hold:
    # Nightly retention (the late schedule or the on-time mode=nightly dispatch) runs
    # only when the owner sets ARCHIVE_NIGHTLY_DELETE=true after a passing manual
    # restore-check. Otherwise it is this no-I/O hold and the archive job is skipped,
    # so a held on-time run never counts as the night's retention.
    if: >-
      (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'nightly'))
      && vars.ARCHIVE_ENABLED == 'true' && vars.ARCHIVE_NIGHTLY_DELETE != 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Report commissioning hold without credentials or source IO
        run: >-
          python -c "import json; print(json.dumps({'status':'ARCHIVE_SCHEDULE_HELD_NO_IO','custody_commissioned':False,'database_connections':0,'drive_requests':0,'source_deletes':0}))"
  archive:
    needs: on-time-check  # defined below
    # `!cancelled()` lets archive run whether on-time-check succeeded, failed or was
    # skipped (manual runs, the on-time dispatch); without it a skipped check skips archive.
    if: >-
      ((github.event_name == 'workflow_dispatch' && inputs.mode != 'nightly') ||
      ((github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'nightly'))
      && vars.ARCHIVE_ENABLED == 'true' && vars.ARCHIVE_NIGHTLY_DELETE == 'true'))
      && !cancelled()
    runs-on: ubuntu-24.04
    # A full proof over every batch (about an hour) precedes any prune.
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements-archive.txt
            constraints.txt
      - run: python -m pip install -r requirements-archive.txt
      - name: Archive outside the dashboard and scan processes
        env:
          ARCHIVE_DATABASE_URL: ${{ secrets.ARCHIVE_DATABASE_URL }}
          DRIVE_OAUTH_TOKEN_JSON: ${{ secrets.DRIVE_OAUTH_TOKEN_JSON }}
          DRIVE_ARCHIVE_FOLDER_ID: ${{ secrets.DRIVE_ARCHIVE_FOLDER_ID }}
          ARCHIVE_DELETE_ENABLED: ${{ vars.ARCHIVE_DELETE_ENABLED }}
          EVENT_NAME: ${{ github.event_name }}
          ARCHIVE_ENABLED: ${{ vars.ARCHIVE_ENABLED }}
          NIGHTLY_DELETE: ${{ vars.ARCHIVE_NIGHTLY_DELETE }}
          ON_TIME_SKIP: ${{ needs.on-time-check.outputs.skip }}
          REQUESTED_MODE: ${{ inputs.mode }}
          REQUESTED_TABLE: ${{ inputs.table }}
          NAV_CUTOFF: ${{ inputs.nav_cutoff }}
          REQUESTED_BATCH_SIZE: ${{ inputs.batch_size }}
          REQUESTED_MAX_BATCHES: ${{ inputs.max_batches }}
          PRESERVED_BEFORE: ${{ inputs.preserved_before }}
          PRESERVED_BATCHES: ${{ inputs.preserved_batches }}
          PRESERVED_SHA256: ${{ inputs.preserved_sha256 }}
          PROVEN_AFTER: ${{ inputs.proven_after }}
          MAX_MINUTES: ${{ inputs.max_minutes }}
        # Inputs are argv, never interpolated into shell source. No secret files
        # or data artifacts are uploaded to GitHub Actions.
        run: |
          python - <<'PY'
          import os
          import json

          def gate_open(name):
              """Owner variable is on, compared like the job-level `if:` (GitHub ignores case)."""
              return os.environ.get(name, '').lower() == 'true'

          nightly = os.environ['EVENT_NAME'] == 'schedule' or (
              os.environ['EVENT_NAME'] == 'workflow_dispatch' and os.environ.get('REQUESTED_MODE') == 'nightly')
          if nightly:
              if not gate_open('NIGHTLY_DELETE') or (
                      os.environ['EVENT_NAME'] == 'workflow_dispatch' and not gate_open('ARCHIVE_ENABLED')):
                  if os.environ['EVENT_NAME'] == 'workflow_dispatch':
                      # The job-level gates started this job, so they and this step disagree
                      # (wiring broken). Fail: a successful archive job must mean retention ran.
                      print(json.dumps({'status': 'NIGHTLY_GATE_MISMATCH', 'database_connections': 0, 'source_deletes': 0}))
                      raise SystemExit(3)
                  print(json.dumps({'status': 'ARCHIVE_SCHEDULE_HELD_NO_IO', 'database_connections': 0, 'source_deletes': 0}))
                  raise SystemExit(0)
              if os.environ['EVENT_NAME'] == 'schedule' and os.environ.get('ON_TIME_SKIP') == 'true':
                  print(json.dumps({'status': 'ARCHIVE_SCHEDULE_SKIPPED_ON_TIME_RUN_SUCCEEDED', 'source_deletes': 0}))
                  raise SystemExit(0)
              from archive_maintenance import main
              raise SystemExit(main(['--mode', 'delete', '--table', 'growing', '--max-batches', '100']))
          if os.environ['EVENT_NAME'] != 'workflow_dispatch':
              print(json.dumps({'status': 'ARCHIVE_SCHEDULE_HELD_NO_IO', 'database_connections': 0, 'source_deletes': 0}))
              raise SystemExit(0)
          from archive_maintenance import main
          args = ['--mode', os.environ['REQUESTED_MODE'], '--table', os.environ['REQUESTED_TABLE']]
          if os.environ.get('NAV_CUTOFF'):
              args += ['--nav-cutoff', os.environ['NAV_CUTOFF']]
          if os.environ.get('REQUESTED_BATCH_SIZE', '').strip():
              args += ['--batch-size', os.environ['REQUESTED_BATCH_SIZE'].strip()]
          args += ['--max-batches', os.environ.get('REQUESTED_MAX_BATCHES', '').strip() or '1']
          if os.environ['REQUESTED_MODE'] == 'prune-preserved':
              args += ['--preserved-before', os.environ.get('PRESERVED_BEFORE', '').strip(),
                       '--preserved-batches', os.environ.get('PRESERVED_BATCHES', '').strip() or '0',
                       '--preserved-sha256', os.environ.get('PRESERVED_SHA256', '').strip()]
              if os.environ.get('MAX_MINUTES', '').strip():
                  args += ['--max-minutes', os.environ['MAX_MINUTES'].strip()]
          if os.environ.get('PROVEN_AFTER', '').strip():
              args += ['--proven-after', os.environ['PROVEN_AFTER'].strip()]
          raise SystemExit(main(args))
          PY
  on-time-check:
    # Late schedule only: did tonight's on-time archive job already succeed? Its own job,
    # so it alone gets `actions: read` and the token. Fail open: continue-on-error, and
    # a failed, timed-out or skipped check leaves `skip` empty, so `archive` still runs.
    if: github.event_name == 'schedule' && vars.ARCHIVE_ENABLED == 'true' && vars.ARCHIVE_NIGHTLY_DELETE == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - id: check
        env:
          ACTIONS_READ_TOKEN: ${{ github.token }}
        run: python3 archive_on_time_check.py
