name: Verified Drive archive (7-day outcomes, 14-day other sources)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Preview, verify one archive batch, or verified deletion
        type: choice
        default: preview
        options: [preview, export, delete]
      table:
        description: Approved source table
        type: choice
        default: mf_nav
        options: [mf_nav, market_quotes, universe_membership_versions, scanner_observations, equity_research.outcomes, universe_membership]
      nav_cutoff:
        description: Optional one-time NAV cutoff YYYY-MM-DD (blank = 14 days)
        type: string
        default: ''
      batch_size:
        description: Optional batch size 1–2000 (blank = safe per-table default)
        type: string
        default: ''
      max_batches:
        description: Manual batch limit 1–200 (use 1 for the first deletion trial)
        type: string
        default: '1'
  schedule:
    - cron: '15 20 * * *'

permissions:
  contents: read

concurrency:
  group: verified-drive-archive
  cancel-in-progress: false

jobs:
  archive:
    # Manual preview/export works before enabling the schedule. Deletion has a
    # separate switch, enforced inside Python as well as workflow configuration.
    if: github.event_name == 'workflow_dispatch' || vars.ARCHIVE_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements-archive.txt
            constraints.txt
      - run: python -m pip install -r requirements-archive.txt
      - name: Archive outside the dashboard and scan processes
        env:
          ARCHIVE_DATABASE_URL: ${{ secrets.ARCHIVE_DATABASE_URL }}
          DRIVE_OAUTH_TOKEN_JSON: ${{ secrets.DRIVE_OAUTH_TOKEN_JSON }}
          DRIVE_ARCHIVE_FOLDER_ID: ${{ secrets.DRIVE_ARCHIVE_FOLDER_ID }}
          ARCHIVE_DELETE_ENABLED: ${{ vars.ARCHIVE_DELETE_ENABLED }}
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_MODE: ${{ inputs.mode }}
          REQUESTED_TABLE: ${{ inputs.table }}
          NAV_CUTOFF: ${{ inputs.nav_cutoff }}
          REQUESTED_BATCH_SIZE: ${{ inputs.batch_size }}
          REQUESTED_MAX_BATCHES: ${{ inputs.max_batches }}
        # Inputs are argv, never interpolated into shell source. No secret files
        # or data artifacts are uploaded to GitHub Actions.
        run: |
          python - <<'PY'
          import os
          from archive_maintenance import main
          if os.environ['EVENT_NAME'] == 'schedule':
              # Fail closed in Python if the deletion switch is not enabled;
              # never silently report a scheduled export as storage cleanup.
              mode = 'delete'
              for table in ('mf_nav', 'market_quotes', 'universe_membership_versions', 'scanner_observations', 'equity_research.outcomes', 'universe_membership'):
                  result = main(['--mode', mode, '--table', table])
                  if result:
                      raise SystemExit(result)
          else:
              args = ['--mode', os.environ['REQUESTED_MODE'], '--table', os.environ['REQUESTED_TABLE']]
              if os.environ.get('NAV_CUTOFF'):
                  args += ['--nav-cutoff', os.environ['NAV_CUTOFF']]
              if os.environ.get('REQUESTED_BATCH_SIZE', '').strip():
                  args += ['--batch-size', os.environ['REQUESTED_BATCH_SIZE'].strip()]
              args += ['--max-batches', os.environ.get('REQUESTED_MAX_BATCHES', '').strip() or '1']
              raise SystemExit(main(args))
          PY
