name: Descriptive market context archive
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Preview is offline; collect fetches today's official NSE participant OI
        type: choice
        default: preview
        options: [preview, collect]
  schedule:
    - cron: '5 15 * * 1-5' # 20:35 IST, not a guaranteed publication/execution time
permissions:
  contents: read
concurrency:
  group: descriptive-market-context
  cancel-in-progress: false
jobs:
  archive:
    if: github.event_name == 'workflow_dispatch' || vars.MARKET_CONTEXT_ARCHIVE_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements-archive.txt
            constraints.txt
      - run: python -m pip install -r requirements-archive.txt
      - name: Collect and verify context only (no database)
        env:
          DRIVE_OAUTH_TOKEN_JSON: ${{ secrets.DRIVE_OAUTH_TOKEN_JSON }}
          MARKET_CONTEXT_DRIVE_FOLDER_ID: ${{ secrets.MARKET_CONTEXT_DRIVE_FOLDER_ID }}
          MARKET_CONTEXT_ARCHIVE_ENABLED: ${{ vars.MARKET_CONTEXT_ARCHIVE_ENABLED }}
          MARKET_CONTEXT_LICENSE_ACK: ${{ vars.MARKET_CONTEXT_LICENSE_ACK }}
          EVENT_NAME: ${{ github.event_name }}
          MODE: ${{ inputs.mode }}
        run: |
          python - <<'PY'
          import os
          from market_context_job import main
          mode = 'collect' if os.environ['EVENT_NAME'] == 'schedule' else os.environ['MODE']
          if mode not in {'preview', 'collect'}:
              raise SystemExit('Invalid mode')
          raise SystemExit(main(['--preview'] if mode == 'preview' else []))
          PY
