name: Inactive synthetic overnight research

on:
  schedule:
    - cron: '37 18 * * 1-5'
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type RUN_SYNTHETIC_ONLY; no private datasets or credentials
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: overnight-research-offline
  cancel-in-progress: false

jobs:
  synthetic-only:
    if: >-
      (github.event_name == 'schedule' && vars.OVERNIGHT_RESEARCH_OFFLINE_ENABLED == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.confirmation == 'RUN_SYNTHETIC_ONLY')
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install exact isolated synthetic research profile
        run: python -m pip install -r requirements-overnight-research.txt
      - name: Verify pinned environment
        run: python -B overnight_research_runner.py --verify-environment
      - name: Run generated fixtures only (no market-data discovery)
        run: python -B overnight_research_runner.py --self-check
      - name: Run deterministic research tests
        run: python -B -m pytest -q -p no:cacheprovider tests/test_overnight_research_dataset.py tests/test_overnight_research_execution.py tests/test_overnight_research_ml.py tests/test_overnight_research_evidence.py tests/test_overnight_research_runner.py tests/test_overnight_research_trials.py tests/test_overnight_research_paper.py
      - name: Strict types
        run: python -B -m mypy --strict --explicit-package-bases --follow-imports=silent overnight_research_dataset.py overnight_research_execution.py overnight_research_ml.py overnight_research_evidence.py overnight_research_runner.py overnight_research_trials.py overnight_research_paper.py tests/test_overnight_research_dataset.py tests/test_overnight_research_execution.py tests/test_overnight_research_ml.py tests/test_overnight_research_evidence.py tests/test_overnight_research_runner.py tests/test_overnight_research_trials.py tests/test_overnight_research_paper.py
      - name: Static lint
        run: python -B -m pyflakes overnight_research_dataset.py overnight_research_execution.py overnight_research_ml.py overnight_research_evidence.py overnight_research_runner.py overnight_research_trials.py overnight_research_paper.py tests/test_overnight_research_dataset.py tests/test_overnight_research_execution.py tests/test_overnight_research_ml.py tests/test_overnight_research_evidence.py tests/test_overnight_research_runner.py tests/test_overnight_research_trials.py tests/test_overnight_research_paper.py
