name: Verified surviving NAV backup (no SQL writes)
on:
  workflow_dispatch:
    inputs:
      confirm_export:
        description: Export all surviving NAV rows to private Drive (no deletion)
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: verified-drive-archive
  cancel-in-progress: false
jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-archive.txt
      - name: Offline preview
        if: ${{ inputs.confirm_export != true }}
        run: python nav_compaction_backup.py
      - name: Confirmed SELECT-only export and verified Drive readback
        if: ${{ inputs.confirm_export == true }}
        env:
          NAV_BACKUP_AUTHORISED: ${{ inputs.confirm_export == true && 'true' || 'false' }}
          ARCHIVE_DATABASE_URL: ${{ secrets.ARCHIVE_DATABASE_URL }}
          DRIVE_OAUTH_TOKEN_JSON: ${{ secrets.DRIVE_OAUTH_TOKEN_JSON }}
          DRIVE_ARCHIVE_FOLDER_ID: ${{ secrets.DRIVE_ARCHIVE_FOLDER_ID }}
        run: python nav_compaction_backup.py --export
