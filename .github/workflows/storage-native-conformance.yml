name: Disposable native storage guard conformance

on:
  workflow_dispatch:
    inputs:
      confirm_disposable:
        description: Run synthetic guard cases in an isolated disposable service only
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: disposable-storage-native-conformance
  cancel-in-progress: false

jobs:
  native:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_disposable == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_DB: storage_conformance_sandbox
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: public-disposable-fixture-only
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d storage_conformance_sandbox"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install pinned disposable driver
        run: python -m pip install 'psycopg[binary]==3.3.5'
      - name: Provision synthetic restricted fixture (no project secrets)
        env:
          PGPASSWORD: public-disposable-fixture-only
        run: >-
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 55432 -U postgres
          -d storage_conformance_sandbox -f sql/storage_native_fixture_disposable_only.sql
      - name: Run native guard cases
        run: python storage_native_conformance.py --execute --confirm-disposable --port 55432
      - name: Provision synthetic ledger using reviewed migrations (disposable only)
        env:
          PGPASSWORD: public-disposable-fixture-only
        run: >-
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 55432 -U postgres
          -d storage_conformance_sandbox -f sql/storage_native_ledger_fixture_disposable_only.sql
      - name: Run native ledger archive transaction cases
        run: python storage_native_ledger_conformance.py --execute --confirm-disposable --port 55432
      - name: Provision inactive operational journal (disposable only)
        env:
          PGPASSWORD: public-disposable-fixture-only
        run: >-
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 55432 -U postgres
          -d storage_conformance_sandbox -f sql/storage_native_operational_fixture_disposable_only.sql
      - name: Run native operational receipt and takeover cases
        run: python storage_native_operational_conformance.py --execute --confirm-disposable --port 55432
