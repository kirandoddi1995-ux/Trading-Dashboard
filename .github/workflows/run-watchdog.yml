name: Run watchdog

# After each Supabase Cron slot, checks that a successful collector / nightly archive run
# exists for it and sends a Telegram alert when it does not (run_watchdog.py). Catches what
# the in-job alert cannot: no dispatch, a run dropped from the queue, a failed checkout.
# The 04:00 IST slot also checks the pg_cron VACUUM job (db_maintenance_watch.py).
on:
  schedule:
    - cron: '0 6 * * 1-5'     # 11:30 IST: the 10:07 scan
    - cron: '30 10 * * 1-5'   # 16:00 IST: the 14:37 scan
    - cron: '30 22 * * *'     # 04:00 IST: the 01:45 nightly archive
  workflow_dispatch:
    inputs:
      slot:
        description: 'Watched cron (set by the Supabase dispatch); empty = every slot'
        type: string
        required: false
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: run-watchdog-${{ github.event.schedule || inputs.slot || 'all' }}
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Check the expected runs
        id: watch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WATCHDOG_SCHEDULE: ${{ github.event.schedule || inputs.slot }}
        run: python run_watchdog.py
      # pg_cron job 8 (nightly VACUUM) runs inside Supabase with no alert of its own:
      # check what it left behind (db_maintenance_watch.py, read-only) in the 04:00 IST slot and on
      # every run that is not a scan slot (manual runs), as run_watchdog.py checks all slots then.
      # !cancelled(): still runs when run_watchdog.py turned the job red (it exits 1 when it is blind or mute),
      # but not after a failed checkout (watch skipped) or a failed install (driver not success).
      - name: Install the database driver for the maintenance check
        id: driver
        if: ${{ !cancelled() && steps.watch.outcome != 'skipped' && (github.event.schedule || inputs.slot) != '0 6 * * 1-5' && (github.event.schedule || inputs.slot) != '30 10 * * 1-5' }}
        run: python -m pip install --quiet -c constraints.txt "psycopg[binary]"
      - name: Check the nightly DB maintenance job (VACUUM, pg_cron job 8)
        if: ${{ !cancelled() && steps.driver.outcome == 'success' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python db_maintenance_watch.py
      - name: Phone alert when this watchdog run fails
        if: failure() || cancelled()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
        run: python3 run_failure_alert.py --label run-watchdog
