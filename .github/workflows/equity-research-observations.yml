name: Equity research price touches (89-observation cohort)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Choose read-only verification or enabled collection
        type: choice
        required: true
        default: check
        options:
          - check
          - collect
  schedule:
    - cron: '30 1 * * 1-6'

permissions:
  contents: read

concurrency:
  group: equity-research-observations
  cancel-in-progress: false

jobs:
  check:
    name: Check permissions only (read-only)
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'check'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Read-only role and source verification
        env:
          EQUITY_RESEARCH_DATABASE_URL: ${{ secrets.EQUITY_RESEARCH_DATABASE_URL }}
        run: python equity_research_collector.py --check
  research:
    if: >-
      vars.EQUITY_RESEARCH_ENABLED == 'true' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && inputs.mode == 'collect'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Verify restricted role and frozen cohort
        env:
          EQUITY_RESEARCH_DATABASE_URL: ${{ secrets.EQUITY_RESEARCH_DATABASE_URL }}
        run: python equity_research_collector.py --check
      - name: Track prior completed dates only (no execution simulation)
        env:
          EQUITY_RESEARCH_DATABASE_URL: ${{ secrets.EQUITY_RESEARCH_DATABASE_URL }}
          UPSTOX_ANALYTICS_TOKEN: ${{ secrets.UPSTOX_ANALYTICS_TOKEN }}
          EQUITY_RESEARCH_SESSIONS_JSON: ${{ vars.EQUITY_RESEARCH_SESSIONS_JSON }}
        run: python equity_research_collector.py
