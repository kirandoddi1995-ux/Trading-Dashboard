name: Scheduled evidence collector

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Collector mode
        required: true
        default: all
        type: choice
        options: [scan, global, open, close, weekly, all]
      apply_migrations:
        description: Apply reviewed database migrations with the owner-only credential
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: scheduled-evidence-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install pinned runtime
        run: python -m pip install -r requirements.txt
      - name: Apply schema migrations with owner-only credential
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply_migrations }}
        env:
          DATABASE_MIGRATION_URL: ${{ secrets.DATABASE_MIGRATION_URL }}
        run: python scheduled_collector.py --migrate
      - name: Verify restricted runtime connection and schema
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          EVIDENCE_LEDGER_SIGNING_KEY: ${{ secrets.EVIDENCE_LEDGER_SIGNING_KEY }}
        run: python scheduled_collector.py --check
      - name: Collect opening evidence
        if: github.event_name == 'schedule' && github.event.schedule == '55 3 * * 1-5'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          UPSTOX_ANALYTICS_TOKEN: ${{ secrets.UPSTOX_ANALYTICS_TOKEN }}
          EVIDENCE_LEDGER_SIGNING_KEY: ${{ secrets.EVIDENCE_LEDGER_SIGNING_KEY }}
        run: python scheduled_collector.py --mode open
      - name: Run prospective Stage-1 equity scan
        if: >-
          github.event_name == 'schedule' &&
          (github.event.schedule == '37 4 * * 1-5' || github.event.schedule == '7 9 * * 1-5')
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          UPSTOX_ANALYTICS_TOKEN: ${{ secrets.UPSTOX_ANALYTICS_TOKEN }}
          EVIDENCE_LEDGER_SIGNING_KEY: ${{ secrets.EVIDENCE_LEDGER_SIGNING_KEY }}
          PROSPECTIVE_DATA_LICENSE_ACK: ${{ vars.PROSPECTIVE_DATA_LICENSE_ACK }}
          SCHEDULED_STAGE1_TOP_N: '150'
        run: python scheduled_collector.py --mode scan
      - name: Collect closing evidence and mature targets
        if: github.event_name == 'schedule' && github.event.schedule == '15 10 * * 1-5'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          UPSTOX_ANALYTICS_TOKEN: ${{ secrets.UPSTOX_ANALYTICS_TOKEN }}
          EVIDENCE_LEDGER_SIGNING_KEY: ${{ secrets.EVIDENCE_LEDGER_SIGNING_KEY }}
          PROSPECTIVE_DATA_LICENSE_ACK: ${{ vars.PROSPECTIVE_DATA_LICENSE_ACK }}
        run: python scheduled_collector.py --mode close
      - name: Capture after-US-close global cues
        if: github.event_name == 'schedule' && github.event.schedule == '45 21 * * 1-5'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          UPSTOX_ANALYTICS_TOKEN: ${{ secrets.UPSTOX_ANALYTICS_TOKEN }}
          EVIDENCE_LEDGER_SIGNING_KEY: ${{ secrets.EVIDENCE_LEDGER_SIGNING_KEY }}
          PROSPECTIVE_DATA_LICENSE_ACK: ${{ vars.PROSPECTIVE_DATA_LICENSE_ACK }}
        run: python scheduled_collector.py --mode global
      - name: Collect weekly mutual-fund disclosures
        if: github.event_name == 'schedule' && github.event.schedule == '30 12 * * 6'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          UPSTOX_ANALYTICS_TOKEN: ${{ secrets.UPSTOX_ANALYTICS_TOKEN }}
          EVIDENCE_LEDGER_SIGNING_KEY: ${{ secrets.EVIDENCE_LEDGER_SIGNING_KEY }}
          PROSPECTIVE_DATA_LICENSE_ACK: ${{ vars.PROSPECTIVE_DATA_LICENSE_ACK }}
        run: python scheduled_collector.py --mode weekly
      - name: Run requested collection
        if: github.event_name == 'workflow_dispatch'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          UPSTOX_ANALYTICS_TOKEN: ${{ secrets.UPSTOX_ANALYTICS_TOKEN }}
          EVIDENCE_LEDGER_SIGNING_KEY: ${{ secrets.EVIDENCE_LEDGER_SIGNING_KEY }}
          PROSPECTIVE_DATA_LICENSE_ACK: ${{ vars.PROSPECTIVE_DATA_LICENSE_ACK }}
        run: python scheduled_collector.py --mode "${{ inputs.mode }}"
