name: Stage-2 rule replay (research)

# Manual only. Replays the app's Stage-2 decision core on ~8 years of Upstox daily bars for the
# current NIFTY 500 under four pre-registered trade-level rules (stage2_rule_replay.py) and
# reports Buys and their net / NIFTY-excess outcomes. Reads only: no database, no orders.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage2-rule-replay
  cancel-in-progress: false

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Replay this shard
        env:
          UPSTOX_ANALYTICS_TOKEN: ${{ secrets.UPSTOX_ANALYTICS_TOKEN }}
          SHARD: ${{ matrix.shard }}
        run: python stage2_rule_replay.py run --shard "$SHARD" --shards 8 --days 3000 --out "replay-shard-$SHARD.json"
      - uses: actions/upload-artifact@v6
        with:
          name: replay-shard-${{ matrix.shard }}
          path: replay-shard-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 30

  summarise:
    needs: replay
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v7
        with:
          pattern: replay-shard-*
          merge-multiple: true
          path: shards
      - name: Summarise (the report says whether all 8 shards are present)
        run: python stage2_rule_replay.py summarise shards/replay-shard-*.json --out stage2-rule-replay-report.json
      - uses: actions/upload-artifact@v6
        with:
          name: stage2-rule-replay-report
          path: stage2-rule-replay-report.json
          if-no-files-found: error
          retention-days: 90
