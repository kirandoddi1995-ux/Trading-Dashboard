name: Production quality gate
on:
  push:
    branches: [main, master]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements.txt pytest pip-audit
      - run: python -m pip check
      - run: python environment_preflight.py --strict
      - run: python production_readiness.py --repository-only --strict
      # requirements.txt already loads constraints.txt via its first `-c` line.
      - run: python -m pip_audit -r requirements.txt
      - run: python -m pytest -q
      - run: python resilience_acceptance.py --game-day
      - run: python deployment_canary.py
      - run: python package_release.py
