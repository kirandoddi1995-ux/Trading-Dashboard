name: Production quality gate
on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      EQUITY_TEST_PGLITE_MODULE: ${{ github.workspace }}/tests/sql-harness/node_modules/@electric-sql/pglite
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked SQL safety test engine
        run: npm ci --prefix tests/sql-harness --ignore-scripts --no-audit --no-fund
      - name: Verify SQL safety test engine (mandatory)
        run: |
          node -e 'const {PGlite}=require(process.env.EQUITY_TEST_PGLITE_MODULE); (async()=>{const db=new PGlite(); try {await db.waitReady; await db.query("SELECT 1");} finally {await db.close();}})().catch(e=>{console.error(e);process.exitCode=1;});'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements.txt pytest pip-audit
      - name: Install offline research type-check tooling
        run: python -m pip install -r requirements-automation.txt
      - run: python -m pip check
      - run: python environment_preflight.py --strict
      - run: python production_readiness.py --repository-only --strict
      - name: Static analysis (mandatory)
        run: python -m pyflakes *.py tests
      - name: Import deployed Streamlit entry point (mandatory)
        run: python -c "import app"
      - name: Strict type checks for research automation (mandatory)
        run: python -m mypy --config-file mypy-automation.ini --cache-dir /tmp/research-mypy-cache
      - name: Import offline research foundation (mandatory)
        run: python -c "import research_integrity, automated_development_checks, automated_directional_replay, research_replay_comparison, automation_health, research_input_archive, archived_directional_replay, research_replay_check, export_development_inputs, forward_nifty_producer, forward_nifty_archive, forward_nifty_job, nifty_previous_close, forward_windows_credentials, forward_nifty_schedule"
      # requirements.txt already loads constraints.txt via its first `-c` line.
      - run: python -m pip_audit -r requirements.txt
      - run: python -m pytest -q
      - run: python resilience_acceptance.py --game-day
      - run: python deployment_canary.py
      - run: python package_release.py
