# Copy these values into Streamlit Community Cloud > App settings > Secrets.
# Never commit the real secrets.toml file.
UPSTOX_TOKEN = "replace-with-a-newly-rotated-daily-token"
UPSTOX_ANALYTICS_TOKEN = "replace-with-your-read-only-analytics-token"
# Restricted quant_app_runtime credential only. Never put the postgres/owner URL here.
DATABASE_URL = "postgresql://quant_app_runtime.project-ref:percent-encoded-password@pooler-host:5432/postgres"
# Generate at least 32 random bytes; use the same value in Streamlit and GitHub.
# Rotating it starts a new signature epoch, so retain retired keys securely for audits.
EVIDENCE_LEDGER_SIGNING_KEY = "replace-with-at-least-32-random-bytes"
# Optional licensed independent quote reconciliation. It remains fail-closed
# until all values and exact internal-key -> NSE:symbol mappings are present.
SECONDARY_QUOTE_PROVIDER = "KITE"
KITE_API_KEY = "replace-with-kite-api-key"
KITE_ACCESS_TOKEN = "replace-with-short-lived-kite-access-token"
SECONDARY_QUOTE_SYMBOL_MAP_JSON = '{"NSE_EQ|INE009A01021":"NSE:INFY"}'
OTEL_EXPORTER_OTLP_ENDPOINT = "https://your-otel-collector.example"
ALERT_WEBHOOK_URL = "https://your-alert-router.example/quant-runtime"
ALERT_WEBHOOK_SIGNING_KEY = "replace-with-a-separate-strong-secret"
GEMINI_API_KEY = "replace-with-a-newly-rotated-api-key"
GEMINI_MODEL = "gemini-3.7-flash"
APP_ENV = "production"
EXPECTED_APP_BUILD = "v22.2-EVIDENCE-GATED-MODEL-PIPELINE"
RESILIENCE_POLICY_SHA256 = "8ea069ab1317fce630fd3506d3ac0d75ecd4096d0c66530a3db714cd370265d0"
APP_AUTH_MODE = "oidc"
AUTH_ALLOWED_EMAILS = ["your-approved-email@example.com"]
AUTH_ALLOWED_DOMAINS = []
AUTH_REQUIRE_VERIFIED_EMAIL = true

# Streamlit native OIDC. Register APP-URL/oauth2callback at the identity provider.
[auth]
redirect_uri = "https://your-streamlit-app.streamlit.app/oauth2callback"
cookie_secret = "replace-with-a-different-strong-random-secret"
client_id = "replace-with-oidc-client-id"
client_secret = "replace-with-oidc-client-secret"
server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"
